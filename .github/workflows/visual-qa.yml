name: Journal visual QA (mobile and A4)
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/selected/**'
      - 'scripts/visual-qa.py'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated QA dependencies
        run: |
          python -m pip install playwright==1.56.0 pypdf==6.1.1
          python -m playwright install --with-deps chromium
      - name: Check mobile geometry and A4 pagination
        run: python scripts/visual-qa.py
      - name: Preserve evidence for human visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-visual-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
