name: Verify Sikum 8 Journal
on:
  push:
    branches: [main]
  # Run structural checks for stacked draft PRs as well as PRs into main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout journal
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SSOT-aligned pages, links and dates
        run: node scripts/verify-journal.mjs
